<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Download ADM Clone</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f4f7f6;
            --card: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        button:disabled { background: #ccc; }
        .progress-container { margin-top: 20px; display: none; }
        .stats { display: flex; justify-content: space-between; font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        .progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.2s; }
        #status { margin-top: 10px; font-size: 0.85rem; text-align: center; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>Super ADM Downloader</h1>
    <input type="text" id="urlInput" placeholder="Cole o link do arquivo aqui...">
    
    <div class="controls">
        <select id="threads" style="padding: 10px; border-radius: 8px; border: 2px solid #ddd;">
            <option value="4">4 Conexões</option>
            <option value="8" selected>8 Conexões (Rápido)</option>
            <option value="16">16 Conexões (Turbo)</option>
        </select>
        <button id="downloadBtn" onclick="iniciarDownload()">BAIXAR AGORA</button>
    </div>

    <div id="progressArea" class="progress-container">
        <div class="stats">
            <span id="percent">0%</span>
            <span id="speed">0 MB/s</span>
        </div>
        <div class="progress-bar">
            <div id="fill" class="progress-fill"></div>
        </div>
        <p id="status">Iniciando conexões paralelas...</p>
    </div>
</div>

<script>
    async function iniciarDownload() {
        const url = document.getElementById('urlInput').value;
        const threadCount = parseInt(document.getElementById('threads').value);
        if (!url) return alert("Por favor, cole um link!");

        const btn = document.getElementById('downloadBtn');
        const progressArea = document.getElementById('progressArea');
        const fill = document.getElementById('fill');
        const percentTxt = document.getElementById('percent');
        const statusTxt = document.getElementById('status');

        btn.disabled = true;
        progressArea.style.display = 'block';

        try {
            // 1. Verificar o tamanho do arquivo (Head Request)
            const response = await fetch(url, { method: 'HEAD' });
            const size = parseInt(response.headers.get('content-length'));
            
            if (isNaN(size)) {
                throw new Error("O servidor não permite medir o tamanho ou download acelerado.");
            }

            const chunkSize = Math.floor(size / threadCount);
            const promises = [];
            let downloadedBytes = 0;
            const startTime = Date.now();

            statusTxt.innerText = `Dividindo arquivo em ${threadCount} partes...`;

            // 2. Criar as conexões paralelas (Multi-threading)
            for (let i = 0; i < threadCount; i++) {
                const start = i * chunkSize;
                const end = (i === threadCount - 1) ? size - 1 : (start + chunkSize - 1);
                
                promises.push(
                    fetch(url, { headers: { 'Range': `bytes=${start}-${end}` } })
                    .then(res => res.arrayBuffer())
                    .then(data => {
                        downloadedBytes += data.byteLength;
                        updateProgress(downloadedBytes, size, startTime);
                        return data;
                    })
                );
            }

            // 3. Juntar as partes e disparar o download
            const results = await Promise.all(promises);
            statusTxt.innerText = "Mesclando partes e salvando...";
            const blob = new Blob(results);
            const downloadUrl = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = url.split('/').pop() || 'arquivo_baixado';
            document.body.appendChild(a);
            a.click();
            
            statusTxt.innerText = "Download concluído com sucesso!";
            btn.disabled = false;

        } catch (err) {
            alert("Erro: " + err.message);
            btn.disabled = false;
        }
    }

    function updateProgress(downloaded, total, startTime) {
        const percent = Math.floor((downloaded / total) * 100);
        document.getElementById('fill').style.width = percent + '%';
        document.getElementById('percent').innerText = percent + '%';
        
        const timeElapsed = (Date.now() - startTime) / 1000;
        const speed = (downloaded / 1024 / 1024 / timeElapsed).toFixed(2);
        document.getElementById('speed').innerText = speed + ' MB/s';
    }
</script>

</body>
</html>
